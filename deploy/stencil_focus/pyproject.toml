[project]
name = "stencil-focus"
version = "0.1.0"
description = "Qwen3-1.7B with inference-time session memory: truncated-away instructions restated under a fixed token budget"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["transformers>=4.51", "torch>=2.4", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stencil_focus"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["gpu: needs a CUDA device", "repo: needs the research repo"]
