[project]
name = "stencil-wave"
version = "0.1.0"
description = "Qwen3-1.7B with an instruction ledger and selective attention amplification, on HuggingFace transformers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "transformers==4.51.0",
    "torch>=2.4",
    "accelerate>=0.26",
    "safetensors>=0.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.30"]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stencil_wave"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["gpu: needs a CUDA device", "repo: needs the research repo (STENCIL_REPO)"]
