[project]
name = "stencil"
version = "0.1.0"
description = "Deterministic experiments for the Stencil research plan"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pytest",
    "ruff",
    "tokenizers",
    "torch",
    "langdetect",
    "immutabledict",
    "nltk>=3.9",
    "transformers>=5.16.1",
    "scipy",
    "huggingface_hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["determinism: bitwise determinism checks"]
pythonpath = ["src", "."]

[tool.ruff]
# third-party code and model directories are not ours to lint
extend-exclude = ["vendor", "models", "archive"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B905: zip(strict=) would change behaviour in sealed generators; kept as-is.
ignore = ["B905"]
